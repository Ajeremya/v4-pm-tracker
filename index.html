<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus4 NPI — PM Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f7f6f3; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;


const INITIAL_TASKS = [
  { id: 1, title: "Resolve AP2214B 12V rail FPY — root-cause & containment", desc: "MainAux 12V rail failures at Sella. Pending station-level isolation and ECO disposition.", area: "yield", prio: "high", status: "inprogress", due: "2026-06-06", jira: "JP-512", site: "sella", created: "2026-05-20", updates: [] },
  { id: 2, title: "Close RH_SENSE failure investigation on AP1972D-FDC", desc: "Elevated retest rate; suspected fixture contact issue. Waiting on fixture rework from Sella ATE team.", area: "yield", prio: "high", status: "blocked", due: "2026-06-04", jira: "JP-498", site: "sella", created: "2026-05-18", updates: [] },
  { id: 3, title: "Validate AS0001-ANT-2 FPY post-TCO recovery", desc: "Antenna boards recovering after TCO. Need 3-day FPY trend confirmation before releasing to production.", area: "yield", prio: "medium", status: "inprogress", due: "2026-06-10", jira: "JP-505", site: "sella", created: "2026-05-22", updates: [] },
  { id: 4, title: "Sign ECOD-02355 for V4 power board change", desc: "ECO pending NPI Director signature. Flex Austin holds release until signed.", area: "eco", prio: "high", status: "backlog", due: "2026-05-28", jira: "", site: "austin", created: "2026-05-24", updates: [] },
  { id: 5, title: "Review V4 tester capacity plan Q3–Q4 2026", desc: "FDC-03 and FMB-03 Unified FT flagged as most constrained at Q4 peak. Alignment with Flex Austin needed.", area: "capacity", prio: "medium", status: "inprogress", due: "2026-06-15", jira: "JP-488", site: "austin", created: "2026-05-10", updates: [] },
  { id: 6, title: "Confirm V4 NPI 50-unit batch milestone status", desc: "Track 50-unit NPI build milestones against production plan. Weekly update to stakeholders.", area: "cross", prio: "medium", status: "inprogress", due: "2026-06-20", jira: "JP-476", site: "austin", created: "2026-05-12", updates: [] },
  { id: 7, title: "Align Machine Vision spec for AP1972D", desc: "MV rejection rate above target. Need updated acceptance criteria from Quality.", area: "quality", prio: "medium", status: "backlog", due: "2026-06-12", jira: "", site: "sella", created: "2026-05-21", updates: [] },
  { id: 8, title: "Ramat Hovav data center feasibility — next steps", desc: "Real estate investment opportunity in Negev industrial zone. Follow up on infrastructure & zoning data.", area: "cross", prio: "low", status: "backlog", due: "", jira: "", site: "other", created: "2026-05-15", updates: [] },
  { id: 9, title: "AP1999B-FPT Flex Austin FPY baseline", desc: "Establish FPY baseline for new station commissioning. Pull first 200-unit ATE session data.", area: "yield", prio: "medium", status: "backlog", due: "2026-06-18", jira: "", site: "austin", created: "2026-05-23", updates: [] },
  { id: 10, title: "Close IGBT gate de-assertion timing issue", desc: "Thermal Attachment Tester commissioning issue at Flex Austin — gate not de-asserting before verification step. Resolved.", area: "quality", prio: "high", status: "done", due: "2026-05-20", jira: "JP-455", site: "austin", created: "2026-05-05", updates: [{ date: "2026-05-20", text: "Root cause confirmed — sequence timing fixed in firmware. Verified on station." }] },
];

const COLS = [
  { id: "backlog",    label: "Backlog",     color: "#888780" },
  { id: "inprogress", label: "In Progress", color: "#378ADD" },
  { id: "blocked",   label: "Blocked",     color: "#E24B4A" },
  { id: "done",      label: "Done",        color: "#1D9E75" },
];

const AREAS = {
  yield:    { label: "ATE Yield",        bg: "#E1F5EE", fg: "#0F6E56" },
  eco:      { label: "ECO / Change",     bg: "#E6F1FB", fg: "#185FA5" },
  supply:   { label: "Supply Chain",     bg: "#FAEEDA", fg: "#854F0B" },
  quality:  { label: "Quality",          bg: "#FBEAF0", fg: "#993556" },
  capacity: { label: "Tester Capacity",  bg: "#EEEDFE", fg: "#534AB7" },
  cross:    { label: "Cross-functional", bg: "#F1EFE8", fg: "#5F5E5A" },
};

const PRIO_COLOR = { high: "#E24B4A", medium: "#EF9F27", low: "#378ADD" };
const SITES = ["sella", "austin", "other"];

function today() { return new Date().toISOString().slice(0, 10); }

function dueStatus(due) {
  if (!due) return null;
  const diff = Math.ceil((new Date(due) - new Date()) / 86400000);
  if (diff < 0) return { label: `${Math.abs(diff)}d overdue`, color: "#E24B4A" };
  if (diff === 0) return { label: "Due today", color: "#EF9F27" };
  if (diff <= 3) return { label: `${diff}d left`, color: "#EF9F27" };
  return { label: new Date(due).toLocaleDateString("en-GB", { day: "numeric", month: "short" }), color: "#888780" };
}

function ProgressRing({ done, total, size = 52 }) {
  const r = (size - 8) / 2;
  const circ = 2 * Math.PI * r;
  const pct = total ? done / total : 0;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e5e5e5" strokeWidth={5} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1D9E75" strokeWidth={5}
        strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round"
        style={{ transition: "stroke-dashoffset .6s ease" }} />
    </svg>
  );
}

const STORAGE_KEY = "venus4_pm_tasks_v1";

function App() {
  const [tasks, setTasks] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : INITIAL_TASKS;
    } catch { return INITIAL_TASKS; }
  });
  const [view, setView] = useState("board");
  const [search, setSearch] = useState("");
  const [filterPrio, setFilterPrio] = useState("all");
  const [filterArea, setFilterArea] = useState("all");
  const [filterSite, setFilterSite] = useState("all");
  const [modal, setModal] = useState(null); // null | { mode: "add"|"edit", task?, status? }
  const [detailId, setDetailId] = useState(null);
  const [updateText, setUpdateText] = useState("");
  const nextId = useRef(tasks.length + 1);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
    nextId.current = Math.max(...tasks.map(t => t.id), 0) + 1;
  }, [tasks]);

  // ── derived ──────────────────────────────────────────────────────────
  const visible = tasks.filter(t => {
    if (filterPrio !== "all" && t.prio !== filterPrio) return false;
    if (filterArea !== "all" && t.area !== filterArea) return false;
    if (filterSite !== "all" && t.site !== filterSite) return false;
    if (search && !t.title.toLowerCase().includes(search.toLowerCase()) && !t.desc.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const done = tasks.filter(t => t.status === "done").length;
  const blocked = tasks.filter(t => t.status === "blocked").length;
  const highOpen = tasks.filter(t => t.prio === "high" && t.status !== "done").length;

  // ── task actions ──────────────────────────────────────────────────────
  function saveTask(form) {
    if (modal.mode === "edit") {
      setTasks(ts => ts.map(t => t.id === form.id ? { ...t, ...form } : t));
    } else {
      setTasks(ts => [...ts, { ...form, id: nextId.current++, created: today(), updates: [] }]);
    }
    setModal(null);
  }

  function deleteTask(id) {
    setTasks(ts => ts.filter(t => t.id !== id));
    setDetailId(null);
  }

  function addUpdate(id) {
    if (!updateText.trim()) return;
    setTasks(ts => ts.map(t => t.id === id
      ? { ...t, updates: [...(t.updates || []), { date: today(), text: updateText.trim() }] }
      : t
    ));
    setUpdateText("");
  }

  function moveTask(id, status) {
    setTasks(ts => ts.map(t => t.id === id ? { ...t, status } : t));
  }

  const detailTask = tasks.find(t => t.id === detailId);

  return (
    <div style={{ fontFamily: "'DM Sans', 'Helvetica Neue', sans-serif", minHeight: "100vh", background: "#f7f6f3", color: "#1a1a1a" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        input, select, textarea { font-family: inherit; outline: none; }
        input::placeholder { color: #aaa; }
        button { font-family: inherit; cursor: pointer; }
        .task-card { transition: box-shadow .15s, transform .1s; }
        .task-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.1); transform: translateY(-1px); }
        .pill-btn { transition: background .15s, color .15s; }
        .pill-btn:hover { opacity: .85; }
        .icon-btn:hover { background: rgba(0,0,0,.06) !important; }
      `}</style>

      {/* ── HEADER ── */}
      <div style={{ background: "#1a1a1a", color: "#fff", padding: "0 28px" }}>
        <div style={{ maxWidth: 1280, margin: "0 auto", display: "flex", alignItems: "center", gap: 16, height: 56 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 28, height: 28, background: "#1D9E75", borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="12" rx="2" fill="#fff" opacity=".9"/><rect x="9" y="2" width="5" height="7" rx="2" fill="#fff" opacity=".9"/></svg>
            </div>
            <span style={{ fontWeight: 600, fontSize: 15, letterSpacing: "-.01em" }}>Venus4 NPI</span>
            <span style={{ color: "#666", fontSize: 13 }}>/ PM Tracker</span>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
            {[["board","Board"],["list","List"],["timeline","Timeline"]].map(([v, l]) => (
              <button key={v} onClick={() => setView(v)}
                style={{ background: view === v ? "rgba(255,255,255,.12)" : "transparent", color: view === v ? "#fff" : "#888", border: "none", padding: "5px 12px", borderRadius: 6, fontSize: 13, fontWeight: view === v ? 500 : 400 }}>
                {l}
              </button>
            ))}
            <button onClick={() => setModal({ mode: "add", status: "backlog" })}
              style={{ background: "#1D9E75", color: "#fff", border: "none", padding: "6px 14px", borderRadius: 6, fontSize: 13, fontWeight: 500, display: "flex", alignItems: "center", gap: 5 }}>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><line x1="6" y1="1" x2="6" y2="11" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
              Add task
            </button>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1280, margin: "0 auto", padding: "20px 28px 40px" }}>

        {/* ── STATS ── */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px,1fr))", gap: 12, marginBottom: 20 }}>
          {[
            { n: tasks.length, l: "Total tasks", sub: "across all areas", c: "#1a1a1a" },
            { n: done, l: "Completed", sub: `${tasks.length ? Math.round(done/tasks.length*100) : 0}% of total`, c: "#1D9E75" },
            { n: blocked, l: "Blocked", sub: "need attention", c: "#E24B4A" },
            { n: highOpen, l: "High priority open", sub: "urgent items", c: "#E24B4A" },
          ].map((s, i) => (
            <div key={i} style={{ background: "#fff", borderRadius: 12, padding: "14px 18px", border: "1px solid #eee", position: "relative", overflow: "hidden" }}>
              {i === 0 && <div style={{ position: "absolute", right: 14, top: 10 }}><ProgressRing done={done} total={tasks.length} /></div>}
              <div style={{ fontSize: 26, fontWeight: 600, color: s.c, lineHeight: 1 }}>{s.n}</div>
              <div style={{ fontSize: 13, fontWeight: 500, color: "#1a1a1a", marginTop: 4 }}>{s.l}</div>
              <div style={{ fontSize: 11, color: "#999", marginTop: 2 }}>{s.sub}</div>
            </div>
          ))}
        </div>

        {/* ── FILTERS ── */}
        <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tasks…"
            style={{ padding: "7px 12px", fontSize: 13, border: "1px solid #e0e0e0", borderRadius: 8, background: "#fff", width: 220 }} />

          <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
            {["all","high","medium","low"].map(p => (
              <button key={p} className="pill-btn" onClick={() => setFilterPrio(p)}
                style={{ padding: "4px 12px", borderRadius: 20, fontSize: 12, border: "none", fontWeight: 500,
                  background: filterPrio === p ? (p === "all" ? "#1a1a1a" : PRIO_COLOR[p]) : "#e8e8e8",
                  color: filterPrio === p ? "#fff" : "#666" }}>
                {p === "all" ? "All priority" : p.charAt(0).toUpperCase() + p.slice(1)}
              </button>
            ))}
          </div>

          <div style={{ display: "flex", gap: 5 }}>
            {["all","sella","austin","other"].map(s => (
              <button key={s} className="pill-btn" onClick={() => setFilterSite(s)}
                style={{ padding: "4px 12px", borderRadius: 20, fontSize: 12, border: "none", fontWeight: 500,
                  background: filterSite === s ? "#1a1a1a" : "#e8e8e8",
                  color: filterSite === s ? "#fff" : "#666" }}>
                {s === "all" ? "All sites" : s.charAt(0).toUpperCase() + s.slice(1)}
              </button>
            ))}
          </div>

          <div style={{ display: "flex", gap: 5, marginLeft: "auto" }}>
            <select value={filterArea} onChange={e => setFilterArea(e.target.value)}
              style={{ padding: "5px 10px", fontSize: 12, border: "1px solid #e0e0e0", borderRadius: 8, background: "#fff", color: "#444" }}>
              <option value="all">All areas</option>
              {Object.entries(AREAS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
        </div>

        {/* ── BOARD VIEW ── */}
        {view === "board" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
            {COLS.map(col => {
              const colTasks = visible.filter(t => t.status === col.id);
              return (
                <div key={col.id}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: col.color }} />
                    <span style={{ fontSize: 12, fontWeight: 600, letterSpacing: ".04em", textTransform: "uppercase", color: "#555" }}>{col.label}</span>
                    <span style={{ marginLeft: "auto", background: "#eee", color: "#777", fontSize: 11, padding: "1px 8px", borderRadius: 10 }}>{colTasks.length}</span>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {colTasks.map(t => <TaskCard key={t.id} task={t} onOpen={() => setDetailId(t.id)} onMove={moveTask} />)}
                    {colTasks.length === 0 && <div style={{ fontSize: 12, color: "#bbb", padding: "8px 4px" }}>No tasks</div>}
                  </div>
                  <button onClick={() => setModal({ mode: "add", status: col.id })}
                    style={{ width: "100%", marginTop: 8, padding: "6px", fontSize: 12, border: "1px dashed #ccc", borderRadius: 8, background: "transparent", color: "#aaa" }}>
                    + Add to {col.label.toLowerCase()}
                  </button>
                </div>
              );
            })}
          </div>
        )}

        {/* ── LIST VIEW ── */}
        {view === "list" && (
          <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #eee", overflow: "hidden" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ borderBottom: "1px solid #f0f0f0" }}>
                  {["Task","Area","Priority","Status","Site","Due","Jira"].map(h => (
                    <th key={h} style={{ padding: "10px 14px", textAlign: "left", fontSize: 11, fontWeight: 600, color: "#999", textTransform: "uppercase", letterSpacing: ".04em" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {visible.map(t => {
                  const due = dueStatus(t.due);
                  const area = AREAS[t.area] || AREAS.cross;
                  return (
                    <tr key={t.id} onClick={() => setDetailId(t.id)}
                      style={{ borderBottom: "1px solid #f5f5f5", cursor: "pointer" }}
                      onMouseEnter={e => e.currentTarget.style.background="#fafafa"}
                      onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                      <td style={{ padding: "10px 14px", fontWeight: 500, maxWidth: 280 }}>{t.title}</td>
                      <td style={{ padding: "10px 14px" }}><span style={{ background: area.bg, color: area.fg, fontSize: 11, padding: "2px 8px", borderRadius: 10, fontWeight: 500 }}>{area.label}</span></td>
                      <td style={{ padding: "10px 14px" }}><span style={{ color: PRIO_COLOR[t.prio], fontWeight: 600, fontSize: 12 }}>● {t.prio}</span></td>
                      <td style={{ padding: "10px 14px" }}><StatusBadge status={t.status} /></td>
                      <td style={{ padding: "10px 14px", color: "#888", fontSize: 12 }}>{t.site}</td>
                      <td style={{ padding: "10px 14px", fontSize: 12, color: due?.color || "#aaa" }}>{due?.label || "—"}</td>
                      <td style={{ padding: "10px 14px", fontSize: 12, color: "#378ADD", fontFamily: "'DM Mono', monospace" }}>{t.jira || "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {/* ── TIMELINE VIEW ── */}
        {view === "timeline" && (
          <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #eee", padding: 20 }}>
            <TimelineView tasks={visible} />
          </div>
        )}
      </div>

      {/* ── DETAIL DRAWER ── */}
      {detailTask && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex" }} onClick={() => setDetailId(null)}>
          <div style={{ flex: 1 }} />
          <div style={{ width: 440, background: "#fff", height: "100%", overflowY: "auto", boxShadow: "-8px 0 40px rgba(0,0,0,.12)", padding: "24px" }}
            onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <AreaTag area={detailTask.area} />
                <SiteBadge site={detailTask.site} />
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                <button className="icon-btn" onClick={() => { setModal({ mode: "edit", task: detailTask }); setDetailId(null); }}
                  style={{ background: "transparent", border: "none", padding: 6, borderRadius: 6, fontSize: 13, color: "#666" }}>✏️ Edit</button>
                <button className="icon-btn" onClick={() => deleteTask(detailTask.id)}
                  style={{ background: "transparent", border: "none", padding: 6, borderRadius: 6, fontSize: 13, color: "#E24B4A" }}>🗑 Delete</button>
                <button className="icon-btn" onClick={() => setDetailId(null)}
                  style={{ background: "transparent", border: "none", padding: "4px 8px", borderRadius: 6, fontSize: 18, color: "#999" }}>×</button>
              </div>
            </div>

            <h2 style={{ fontSize: 17, fontWeight: 600, lineHeight: 1.4, marginBottom: 10, color: "#1a1a1a" }}>{detailTask.title}</h2>
            <p style={{ fontSize: 13, color: "#666", lineHeight: 1.6, marginBottom: 16 }}>{detailTask.desc}</p>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 20 }}>
              {[
                ["Priority", <span style={{ color: PRIO_COLOR[detailTask.prio], fontWeight: 600 }}>{detailTask.prio}</span>],
                ["Status", <StatusBadge status={detailTask.status} />],
                ["Due", dueStatus(detailTask.due) ? <span style={{ color: dueStatus(detailTask.due).color }}>{dueStatus(detailTask.due).label}</span> : <span style={{ color: "#aaa" }}>Not set</span>],
                ["Jira", detailTask.jira ? <span style={{ color: "#378ADD", fontFamily: "'DM Mono', monospace", fontSize: 12 }}>{detailTask.jira}</span> : <span style={{ color: "#aaa" }}>—</span>],
              ].map(([l, v]) => (
                <div key={l} style={{ background: "#f7f6f3", borderRadius: 8, padding: "8px 12px" }}>
                  <div style={{ fontSize: 10, color: "#aaa", fontWeight: 600, textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 3 }}>{l}</div>
                  <div style={{ fontSize: 13 }}>{v}</div>
                </div>
              ))}
            </div>

            {/* Move status */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#aaa", textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 8 }}>Move to</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {COLS.filter(c => c.id !== detailTask.status).map(c => (
                  <button key={c.id} onClick={() => { moveTask(detailTask.id, c.id); setDetailId(null); }}
                    style={{ padding: "4px 12px", borderRadius: 20, fontSize: 12, border: `1px solid ${c.color}`, background: "transparent", color: c.color, fontWeight: 500 }}>
                    → {c.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Updates log */}
            <div style={{ borderTop: "1px solid #f0f0f0", paddingTop: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12, color: "#333" }}>Updates</div>
              {(detailTask.updates || []).length === 0 && <p style={{ fontSize: 12, color: "#bbb", marginBottom: 12 }}>No updates yet.</p>}
              {(detailTask.updates || []).map((u, i) => (
                <div key={i} style={{ borderLeft: "2px solid #1D9E75", paddingLeft: 10, marginBottom: 10 }}>
                  <div style={{ fontSize: 10, color: "#aaa", marginBottom: 2 }}>{u.date}</div>
                  <div style={{ fontSize: 13, color: "#444", lineHeight: 1.5 }}>{u.text}</div>
                </div>
              ))}
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <textarea value={updateText} onChange={e => setUpdateText(e.target.value)}
                  placeholder="Add an update…"
                  style={{ flex: 1, padding: "7px 10px", fontSize: 13, border: "1px solid #e0e0e0", borderRadius: 8, resize: "none", height: 64, background: "#fafafa" }} />
                <button onClick={() => addUpdate(detailTask.id)}
                  style={{ padding: "7px 14px", background: "#1D9E75", color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 500, alignSelf: "flex-end" }}>
                  Post
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── ADD/EDIT MODAL ── */}
      {modal && <TaskModal modal={modal} onSave={saveTask} onClose={() => setModal(null)} />}
    </div>
  );
}

function TaskCard({ task, onOpen, onMove }) {
  const area = AREAS[task.area] || AREAS.cross;
  const due = dueStatus(task.due);
  return (
    <div className="task-card" onClick={onOpen}
      style={{ background: "#fff", borderRadius: 10, border: "1px solid #eee", padding: "12px 14px", cursor: "pointer" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
        <span style={{ background: area.bg, color: area.fg, fontSize: 10, padding: "2px 7px", borderRadius: 10, fontWeight: 600 }}>{area.label}</span>
        <span style={{ marginLeft: "auto", width: 8, height: 8, borderRadius: "50%", background: PRIO_COLOR[task.prio], flexShrink: 0 }} title={task.prio + " priority"} />
      </div>
      <div style={{ fontSize: 13, fontWeight: 500, lineHeight: 1.4, marginBottom: 6, color: "#1a1a1a" }}>{task.title}</div>
      <div style={{ fontSize: 11, color: "#888", lineHeight: 1.5, marginBottom: 8 }}>{task.desc.length > 80 ? task.desc.slice(0,80) + "…" : task.desc}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11 }}>
        {task.jira && <span style={{ color: "#378ADD", fontFamily: "'DM Mono', monospace" }}>{task.jira}</span>}
        {due && <span style={{ color: due.color, marginLeft: "auto" }}>{due.label}</span>}
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const map = { backlog: ["#f0f0f0","#888","Backlog"], inprogress: ["#E6F1FB","#185FA5","In Progress"], blocked: ["#FCEBEB","#A32D2D","Blocked"], done: ["#E1F5EE","#0F6E56","Done"] };
  const [bg, fg, label] = map[status] || map.backlog;
  return <span style={{ background: bg, color: fg, fontSize: 11, padding: "2px 9px", borderRadius: 10, fontWeight: 600 }}>{label}</span>;
}

function AreaTag({ area }) {
  const a = AREAS[area] || AREAS.cross;
  return <span style={{ background: a.bg, color: a.fg, fontSize: 11, padding: "2px 9px", borderRadius: 10, fontWeight: 600 }}>{a.label}</span>;
}

function SiteBadge({ site }) {
  const map = { sella: ["#FAEEDA","#854F0B"], austin: ["#EEEDFE","#534AB7"], other: ["#F1EFE8","#5F5E5A"] };
  const [bg, fg] = map[site] || map.other;
  return <span style={{ background: bg, color: fg, fontSize: 11, padding: "2px 9px", borderRadius: 10, fontWeight: 600 }}>{site.charAt(0).toUpperCase()+site.slice(1)}</span>;
}

function TimelineView({ tasks }) {
  const withDue = tasks.filter(t => t.due).sort((a,b) => a.due.localeCompare(b.due));
  const noDue   = tasks.filter(t => !t.due);

  if (withDue.length === 0 && noDue.length === 0) return <p style={{ color: "#aaa", fontSize: 13 }}>No tasks match the current filter.</p>;

  const grouped = {};
  withDue.forEach(t => {
    const d = new Date(t.due);
    const key = d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(t);
  });

  return (
    <div>
      {Object.entries(grouped).map(([month, items]) => (
        <div key={month} style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#aaa", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 10 }}>{month}</div>
          {items.map(t => {
            const due = dueStatus(t.due);
            const area = AREAS[t.area] || AREAS.cross;
            return (
              <div key={t.id} style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: 10, paddingLeft: 10, borderLeft: `3px solid ${PRIO_COLOR[t.prio]}` }}>
                <div style={{ fontSize: 11, color: due?.color || "#aaa", minWidth: 72, paddingTop: 2 }}>
                  {new Date(t.due).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
                </div>
                <div style={{ flex: 1, background: "#f7f6f3", borderRadius: 8, padding: "8px 12px" }}>
                  <div style={{ display: "flex", gap: 6, marginBottom: 4 }}>
                    <AreaTag area={t.area} />
                    <StatusBadge status={t.status} />
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 500 }}>{t.title}</div>
                  {t.jira && <div style={{ fontSize: 11, color: "#378ADD", fontFamily: "'DM Mono', monospace", marginTop: 3 }}>{t.jira}</div>}
                </div>
              </div>
            );
          })}
        </div>
      ))}
      {noDue.length > 0 && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#ccc", textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 10 }}>No due date</div>
          {noDue.map(t => (
            <div key={t.id} style={{ display: "flex", gap: 14, alignItems: "center", marginBottom: 8, paddingLeft: 10, borderLeft: "3px solid #ddd" }}>
              <div style={{ flex: 1, background: "#f7f6f3", borderRadius: 8, padding: "8px 12px" }}>
                <div style={{ fontSize: 13, fontWeight: 500, color: "#666" }}>{t.title}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TaskModal({ modal, onSave, onClose }) {
  const t = modal.task || {};
  const [form, setForm] = useState({
    id: t.id,
    title: t.title || "",
    desc: t.desc || "",
    area: t.area || "yield",
    prio: t.prio || "medium",
    status: t.status || modal.status || "backlog",
    due: t.due || "",
    jira: t.jira || "",
    site: t.site || "sella",
  });

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.45)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center" }}
      onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: 14, padding: "24px 28px", width: 460, maxHeight: "90vh", overflowY: "auto", boxShadow: "0 20px 60px rgba(0,0,0,.2)" }}
        onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <h3 style={{ fontSize: 16, fontWeight: 600, margin: 0 }}>{modal.mode === "edit" ? "Edit task" : "New task"}</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, color: "#aaa", lineHeight: 1, padding: 0 }}>×</button>
        </div>

        <label style={lbl}>Title</label>
        <input value={form.title} onChange={e => set("title", e.target.value)}
          placeholder="Short verb-first title" style={inp} />

        <label style={lbl}>Description</label>
        <textarea value={form.desc} onChange={e => set("desc", e.target.value)}
          placeholder="Context & what needs to happen"
          style={{ ...inp, height: 72, resize: "vertical" }} />

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {[
            ["Area", "area", Object.entries(AREAS).map(([k,v]) => [k, v.label])],
            ["Priority", "prio", [["high","High"],["medium","Medium"],["low","Low"]]],
            ["Status", "status", COLS.map(c => [c.id, c.label])],
            ["Site", "site", SITES.map(s => [s, s.charAt(0).toUpperCase()+s.slice(1)])],
          ].map(([label, key, opts]) => (
            <div key={key}>
              <label style={lbl}>{label}</label>
              <select value={form[key]} onChange={e => set(key, e.target.value)} style={inp}>
                {opts.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
              </select>
            </div>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div>
            <label style={lbl}>Due date</label>
            <input type="date" value={form.due} onChange={e => set("due", e.target.value)} style={inp} />
          </div>
          <div>
            <label style={lbl}>Jira ticket</label>
            <input value={form.jira} onChange={e => set("jira", e.target.value)} placeholder="JP-###" style={{ ...inp, fontFamily: "'DM Mono', monospace" }} />
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginTop: 20, justifyContent: "flex-end" }}>
          <button onClick={onClose} style={{ padding: "8px 18px", border: "1px solid #e0e0e0", borderRadius: 8, background: "#fff", fontSize: 13, color: "#666" }}>Cancel</button>
          <button onClick={() => { if (form.title.trim()) onSave(form); }}
            style={{ padding: "8px 20px", background: "#1D9E75", color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 500 }}>
            {modal.mode === "edit" ? "Save changes" : "Create task"}
          </button>
        </div>
      </div>
    </div>
  );
}

const lbl = { display: "block", fontSize: 11, fontWeight: 600, color: "#aaa", textTransform: "uppercase", letterSpacing: ".04em", marginBottom: 4, marginTop: 12 };
const inp = { width: "100%", padding: "8px 10px", fontSize: 13, border: "1px solid #e0e0e0", borderRadius: 8, background: "#fafafa", color: "#1a1a1a" };


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
