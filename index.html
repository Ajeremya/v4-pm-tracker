<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V4 Tracker">
<title>Venus4 NPI — PM Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;font-family:'DM Sans','Helvetica Neue',sans-serif;}
:root{--bg:#0e0e10;--bg2:#18181b;--bg3:#1f1f23;--bg4:#27272c;--border:#2e2e35;--border2:#3a3a44;--text:#f0f0f2;--text2:#a0a0b0;--text3:#606075;--green:#1D9E75;--red:#E24B4A;--amber:#EF9F27;--blue:#4fa3e8;--card:#18181b;--header:#111114;--inp-bg:#1f1f23;--inp-br:#2e2e35;}
body.light{--bg:#f5f4f0;--bg2:#fff;--bg3:#eeeee8;--bg4:#e2e2d8;--border:#ddddd0;--border2:#c8c8b8;--text:#1a1a1a;--text2:#555;--text3:#999;--card:#fff;--header:#1a1a1a;--inp-bg:#fafaf6;--inp-br:#ddddd0;}
body{background:var(--bg);color:var(--text);}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;outline:none;background:var(--inp-bg);color:var(--text);border:1px solid var(--inp-br);border-radius:8px;font-size:13px;}
input::placeholder,textarea::placeholder{color:var(--text3);}
select option{background:var(--bg3);color:var(--text);}
#header{background:var(--header);border-bottom:1px solid var(--border);padding:0 24px;}
#header-inner{max-width:1300px;margin:0 auto;height:54px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;}
#main{max-width:1300px;width:100%;margin:0 auto;padding:18px 24px 36px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;position:relative;overflow:hidden;}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-scroll{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.filter-scroll::-webkit-scrollbar{display:none;}
.pill{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;border:none;cursor:pointer;white-space:nowrap;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.col-cards{display:flex;flex-direction:column;gap:7px;}
.task-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:box-shadow .15s,transform .1s;}
.task-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(-1px);}
.area-tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;}
.status-badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;}
.list-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.list-table{width:100%;border-collapse:collapse;font-size:13px;min-width:580px;}
.list-table th{padding:9px 13px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
.list-table td{padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:middle;}
.list-table tr.data:hover td{background:var(--bg3);cursor:pointer;}
.timeline-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
#drawer-bg{position:fixed;inset:0;z-index:200;display:none;}
#drawer-bg.open{display:flex;}
#drawer{width:420px;background:var(--bg2);height:100%;overflow-y:auto;border-left:1px solid var(--border);padding:22px 20px;margin-left:auto;}
.drawer-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.meta-cell{background:var(--bg3);border-radius:8px;padding:8px 11px;}
.update-item{border-left:2px solid var(--green);padding-left:10px;margin-bottom:10px;}
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;}
#modal-bg.open{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:460px;max-height:90vh;overflow-y:auto;}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-lbl{display:block;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;margin-top:12px;}
.form-inp{width:100%;padding:8px 10px;font-size:13px;border-radius:8px;background:var(--inp-bg);color:var(--text);border:1px solid var(--inp-br);}
#settings-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;}
#settings-bg.open{display:flex;}
.settings-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:440px;max-height:88vh;overflow-y:auto;}
.area-row{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:9px;padding:8px 11px;margin-bottom:7px;}
.palette-swatch{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
#banner{position:fixed;top:0;left:0;right:0;z-index:500;padding:10px 20px;font-size:13px;font-weight:500;text-align:center;display:none;transition:opacity .3s;}
#mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg2);border-top:1px solid var(--border);padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.mnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:4px 0;font-size:10px;color:var(--text3);font-weight:500;}
.mnav-btn.active{color:var(--green);}
.mnav-btn svg{width:22px;height:22px;}
#email-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;}
#email-modal-bg.open{display:flex;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){
  .desktop-only{display:none!important;}
  #mobile-nav{display:flex!important;}
  .board{grid-template-columns:1fr!important;}
  .stats-grid{grid-template-columns:1fr 1fr!important;}
  #main{padding:12px 12px 80px!important;}
  #drawer{width:100%!important;border-radius:16px 16px 0 0!important;max-height:88vh!important;border-left:none!important;border-top:1px solid var(--border)!important;}
  #drawer-bg.open{align-items:flex-end!important;}
  .modal-box,.settings-box{width:96vw!important;padding:18px 16px!important;}
  #header{padding:0 14px;}
}
@media(min-width:701px){.mobile-only{display:none!important;}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="banner"></div>
<div id="app">
  <div id="header">
    <div id="header-inner">
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <div style="width:26px;height:26px;background:#1D9E75;border-radius:6px;display:flex;align-items:center;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="12" rx="2" fill="#fff" opacity=".9"/><rect x="9" y="2" width="5" height="7" rx="2" fill="#fff" opacity=".9"/></svg>
        </div>
        <span style="font-weight:600;font-size:14px;">Venus4 NPI</span>
        <span style="color:var(--text3);font-size:13px;">/ PM Tracker</span>
        <div id="sync-dot" style="width:7px;height:7px;border-radius:50%;background:#1D9E75;margin-left:4px;" title="Firebase connected"></div>
      </div>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center;" class="desktop-only">
        <button onclick="setView('board')" id="vbtn-board" style="background:rgba(255,255,255,.1);color:var(--text);border:none;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:500;">Board</button>
        <button onclick="setView('list')"  id="vbtn-list"  style="background:transparent;color:var(--text3);border:none;padding:4px 12px;border-radius:6px;font-size:13px;">List</button>
        <button onclick="setView('timeline')" id="vbtn-timeline" style="background:transparent;color:var(--text3);border:none;padding:4px 12px;border-radius:6px;font-size:13px;">Timeline</button>
      </div>
      <button onclick="openSettings()" class="desktop-only" style="background:transparent;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:4px;">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="3"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42"/></svg>
        Areas
      </button>
      <button onclick="toggleTheme()" id="theme-btn" style="background:transparent;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:6px;font-size:14px;">☀️</button>
      <button onclick="openEmailModal()" class="desktop-only" style="background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:4px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
        From email
      </button>
      <button onclick="syncToDo()" id="todo-sync-btn" class="desktop-only" style="background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:4px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Sync To Do
      </button>
      <button onclick="openModal(null,'backlog')" class="desktop-only" style="background:#1D9E75;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px;flex-shrink:0;">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><line x1="6" y1="1" x2="6" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add task
      </button>
    </div>
  </div>
  <div id="main">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="filters" id="filters"></div>
    <div id="view-container"></div>
  </div>
  <nav id="mobile-nav" style="display:none;flex-direction:row;">
    <button class="mnav-btn active" id="mnav-board" onclick="setView('board')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="11" rx="2"/></svg>Board</button>
    <button class="mnav-btn" id="mnav-list" onclick="setView('list')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor"/><circle cx="3" cy="18" r="1.5" fill="currentColor"/></svg>List</button>
    <button class="mnav-btn" id="mnav-timeline" onclick="setView('timeline')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Timeline</button>
    <button class="mnav-btn" onclick="openModal(null,'backlog')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add</button>
    <button class="mnav-btn" onclick="openSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>Areas</button>

</div>

<div id="drawer-bg" onclick="closeDrawer()"><div id="drawer" onclick="event.stopPropagation()"></div></div>
<div id="modal-bg" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()" id="modal-box"></div></div>
<div id="settings-bg" onclick="closeSettings()"><div class="settings-box" onclick="event.stopPropagation()" id="settings-box"></div></div>
<div id="email-modal-bg" onclick="closeEmailModal()">

    <div id="email-step-1">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="font-size:15px;font-weight:600">📧 Create task from email</h3>
        <button onclick="closeEmailModal()" style="background:none;border:none;font-size:20px;color:var(--text3)">×</button>

      <p style="font-size:12px;color:var(--text3);margin-bottom:12px">Paste any Outlook email — Claude will extract the task automatically.</p>

      </div>
    </div>
    <div id="email-step-2" style="display:none;text-align:center;padding:40px 20px">

      <div class="modal-row">
        <div><label class="form-lbl">Area</label><select class="form-inp" id="em-area"></select></div>
        <div><label class="form-lbl">Priority</label><select class="form-inp" id="em-prio"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
        <div><label class="form-lbl">Status</label><select class="form-inp" id="em-status"><option value="backlog" selected>Backlog</option><option value="inprogress">In Progress</option><option value="blocked">Blocked</option><option value="done">Done</option></select></div>
        <div><label class="form-lbl">Site</label><select class="form-inp" id="em-site"><option value="sella">Sella</option><option value="austin">Austin</option><option value="other">Other</option></select></div>
        <div><label class="form-lbl">Due date</label><input class="form-inp" id="em-due" type="date"></div>
        <div><label class="form-lbl">Jira</label><input class="form-inp" id="em-jira" placeholder="JP-###" style="font-family:'DM Mono',monospace"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:space-between">
        <button onclick="document.getElementById('email-step-3').style.display='none';document.getElementById('email-step-1').style.display=''" style="background:transparent;border:none;font-size:12px;color:var(--text3)">← Try again</button>

          <button onclick="closeEmailModal()" style="padding:7px 14px;border:1px solid var(--border2);border-radius:8px;background:transparent;font-size:13px;color:var(--text2)">Cancel</button>
          <button onclick="saveEmailTask()" style="padding:7px 16px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500">+ Save task</button>
        </div>
      </div>
    </div>
    <div id="email-step-error" style="display:none;text-align:center;padding:30px 20px">
      <div style="font-size:28px;margin-bottom:10px">⚠️</div>
      <div style="font-size:13px;font-weight:500;margin-bottom:6px">Could not analyze email</div>
      <div id="email-error-msg" style="font-size:12px;color:var(--text3);margin-bottom:14px"></div>
      <button onclick="document.getElementById('email-step-error').style.display='none';document.getElementById('email-step-1').style.display=''" style="padding:7px 14px;background:var(--bg4);color:var(--text2);border:none;border-radius:8px;font-size:13px">← Try again</button>
    </div>
  </div>
</div>

// ── LOCAL STORAGE ─────────────────────────────────────────────────────────────
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// ── FIREBASE SDK ─────────────────────────────────────────────────────────────
let db = null;

function initFirebase(){
  try {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    setSyncDot("connected");
    return true;
  } catch(e) {
    console.error("Firebase init error", e);
    setSyncDot("error");
    return false;
  }
}

async function loadFromFirebase(){
  setSyncDot("syncing");
  if(!db){ tasks = FALLBACK_TASKS; nextId = 100; setSyncDot("error"); renderAll(); return; }
  try {
    const snap = await db.ref("/tasks").get();
    const data = snap.val();
    if(data && typeof data === "object"){
      const loaded = Object.values(data).filter(Boolean).map(t=>({updates:[],...t}));
      if(loaded.length > 0){
        tasks = loaded;
        nextId = Math.max(...tasks.map(t=>Number(t.id)||0), 0) + 1;
        firebaseLoaded = true;
        setSyncDot("connected");
        renderAll();
        return;
      }
    }
    // Empty — seed
    tasks = FALLBACK_TASKS; nextId = 100;
    await writeTasks();
    setSyncDot("connected");
    renderAll();
  } catch(e) {
    console.error("Firebase load error", e);
    tasks = FALLBACK_TASKS; nextId = 100;
    setSyncDot("error"); renderAll();
  }
}

async function writeTasks(){
  if(!db) return;
  const obj = {};
  tasks.forEach(t => { obj[t.id] = t; });
  try { await db.ref("/tasks").set(obj); } catch(e){ console.error("Firebase write error",e); }
}

async function writeTask(t){
  if(!db) return;
  try { await db.ref("/tasks/"+t.id).set(t); } catch(e){ console.error("Firebase write error",e); }
}

function setSyncDot(state){
  const dot = document.getElementById("sync-dot");
  if(!dot) return;
  if(state==="connected") dot.style.background="#1D9E75";
  else if(state==="syncing") dot.style.background="#EF9F27";
  else dot.style.background="#E24B4A";
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function amap(){return Object.fromEntries(areas.map(a=>[a.id,a]));}
function toggleFilter(set,val){if(set.has(val))set.delete(val);else set.add(val);}

function dueStatus(due){
  if(!due)return null;
  const diff=Math.ceil((new Date(due)-new Date())/86400000);
  if(diff<0)return{label:`${Math.abs(diff)}d overdue`,color:"#E24B4A"};
  if(diff===0)return{label:"Due today",color:"#EF9F27"};
  if(diff<=3)return{label:`${diff}d left`,color:"#EF9F27"};
  return{label:new Date(due).toLocaleDateString("en-GB",{day:"numeric",month:"short"}),color:"#606075"};
}

function areaTag(areaId){
  const am=amap();const a=am[areaId]||{label:areaId,bg:"#222",fg:"#aaa",lbg:"#eee",lfg:"#555"};
  const bg=dark?a.bg:a.lbg,fg=dark?a.fg:a.lfg;
  return`<span class="area-tag" style="background:${bg};color:${fg}">${esc(a.label)}</span>`;
}

function statusBadge(status){
  const map=dark?STATUS_D:STATUS_L;const[bg,fg,label]=map[status]||map.backlog;
  return`<span class="status-badge" style="background:${bg};color:${fg}">${label}</span>`;
}

function progressRing(done,total){
  const size=52,r=(size-8)/2,circ=2*Math.PI*r,pct=total?done/total:0;
  const track=dark?"#27272c":"#e0e0e0";
  return`<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1D9E75" stroke-width="5"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}" stroke-linecap="round"
      style="transition:stroke-dashoffset .6s"/>
  </svg>`;
}

let bannerTimer = null;
function showBanner(msg,type,duration){
  const b=document.getElementById("banner");
  b.textContent=msg;
  b.style.display="block";
  b.style.opacity="1";
  b.style.animation="fadeIn .25s ease";
  if(type==="connected")   {b.style.background="#0f3d2a";b.style.color="#4ecca3";}
  else if(type==="error")  {b.style.background="#3a1010";b.style.color="#e06060";}
  else                     {b.style.background="#1a2a3a";b.style.color="#6bb8f7";}
  if(bannerTimer) clearTimeout(bannerTimer);
  if(duration>0) bannerTimer=setTimeout(()=>{b.style.opacity="0";setTimeout(()=>b.style.display="none",300);},duration);
}

// ── FILTER & VISIBLE ──────────────────────────────────────────────────────────
function visible(){
  return tasks.filter(t=>{
    if(fPrio.size>0&&!fPrio.has(t.prio))return false;
    if(fArea!=="all"&&t.area!==fArea)return false;
    if(fSite.size>0&&!fSite.has(t.site))return false;
    if(fStatus.size>0&&!fStatus.has(t.status))return false;
    if(search){const q=search.toLowerCase();if(!t.title.toLowerCase().includes(q)&&!(t.desc||"").toLowerCase().includes(q))return false;}
    return true;
  });
}

  const highOpen=tasks.filter(t=>t.prio==="high"&&t.status!=="done").length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  document.getElementById("stats-grid").innerHTML=[
    {n:tasks.length,l:"Total tasks",sub:"all areas",c:"var(--text)",ring:true},
    {n:done,l:"Completed",sub:`${pct}% done`,c:"#1D9E75"},
    {n:blocked,l:"Blocked",sub:"need attention",c:"#E24B4A"},
    {n:highOpen,l:"High open",sub:"urgent",c:"#E24B4A"},

function renderTimeline(){
  const vis=visible();
  const withDue=vis.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due));
  const noDue=vis.filter(t=>!t.due);
  if(!withDue.length&&!noDue.length)return`<div class="timeline-wrap"><p style="color:var(--text3);font-size:13px">No tasks match filter.</p></div>`;
  const grouped={};
  withDue.forEach(t=>{const k=new Date(t.due).toLocaleDateString("en-GB",{month:"long",year:"numeric"});if(!grouped[k])grouped[k]=[];grouped[k].push(t);});
  let html=`<div class="timeline-wrap">`;
  for(const[m,items] of Object.entries(grouped)){
    html+=`<div style="margin-bottom:22px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px">${m}</div>
      ${items.map(t=>{const due=dueStatus(t.due);return`<div style="display:flex;gap:12px;margin-bottom:9px;padding-left:10px;border-left:3px solid ${PRIO_COLOR[t.prio]};cursor:pointer" onclick="openDrawer(${t.id})">
        <div style="font-size:11px;color:${due?due.color:"var(--text3)"};min-width:62px;padding-top:2px;white-space:nowrap">${new Date(t.due).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</div>
        <div style="flex:1;background:var(--bg3);border-radius:8px;padding:8px 11px">
          <div style="display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap">${areaTag(t.area)} ${statusBadge(t.status)}</div>
          <div style="font-size:13px;font-weight:500">${esc(t.title)}</div>
          ${t.jira?`<div style="font-size:11px;color:var(--blue);font-family:'DM Mono',monospace;margin-top:3px">${esc(t.jira)}</div>`:""}
        </div>
      </div>`;}).join("")}
    </div>`;
  }
  if(noDue.length){html+=`<div><div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px">No due date</div>${noDue.map(t=>`<div style="display:flex;gap:12px;margin-bottom:8px;padding-left:10px;border-left:3px solid var(--border2)"><div style="flex:1;background:var(--bg3);border-radius:8px;padding:8px 11px"><div style="font-size:13px;font-weight:500;color:var(--text2)">${esc(t.title)}</div></div></div>`).join("")}</div>`;}
  return html+`</div>`;
}

        ${COLS.filter(c=>c.id!==t.status).map(c=>`<button onclick="moveTask(${t.id},'${c.id}')" style="padding:4px 11px;border-radius:20px;font-size:12px;border:1px solid ${c.color};background:transparent;color:${c.color};font-weight:500;cursor:pointer">→ ${c.label}</button>`).join("")}
      </div>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:11px">Updates</div>
      ${!(t.updates||[]).length?`<p style="font-size:12px;color:var(--text3);margin-bottom:10px">No updates yet.</p>`:""}
      ${(t.updates||[]).map(u=>`<div class="update-item"><div style="font-size:10px;color:var(--text3);margin-bottom:2px">${u.date}</div><div style="font-size:13px;color:var(--text2);line-height:1.5">${esc(u.text)}</div></div>`).join("")}
      <div style="display:flex;gap:7px;margin-top:10px">
        <textarea id="update-inp" placeholder="Add an update…" rows="3" style="flex:1;padding:7px 10px;font-size:13px;border-radius:8px;resize:none;height:60px;background:var(--inp-bg);color:var(--text);border:1px solid var(--inp-br)"></textarea>
        <button onclick="addUpdate(${t.id})" style="padding:7px 13px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;align-self:flex-end;cursor:pointer">Post</button>
      </div>
    </div>`;
}

async function addUpdate(id){
  const el=document.getElementById("update-inp");if(!el||!el.value.trim())return;
  tasks=tasks.map(t=>t.id===id?{...t,updates:[...(t.updates||[]),{date:today(),text:el.value.trim()}]}:t);
  await writeTask(tasks.find(t=>t.id===id));
  renderDrawer();
}

async function moveTask(id,status){
  tasks=tasks.map(t=>t.id===id?{...t,status}:t);
  await writeTask(tasks.find(t=>t.id===id));
  closeDrawer();renderAll();
}

async function deleteTask(id){
  if(!confirm("Delete this task?"))return;
  tasks=tasks.filter(t=>t.id!==id);
  await fbSet("/tasks/"+id,null);
  closeDrawer();renderAll();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(id,defaultStatus){
  modalEditId=id;const t=id?tasks.find(x=>x.id===id):null;
  const aOpts=areas.map(a=>`<option value="${a.id}" ${(t?t.area:areas[0]?.id)===a.id?"selected":""}>${esc(a.label)}</option>`).join("");
  const cOpts=COLS.map(c=>`<option value="${c.id}" ${(t?t.status:(defaultStatus||"backlog"))===c.id?"selected":""}>${c.label}</option>`).join("");
  const sOpts=SITES.map(s=>`<option value="${s}" ${(t?t.site:"sella")===s?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("");
  document.getElementById("modal-box").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:15px;font-weight:600">${id?"Edit task":"New task"}</h3>
      <button onclick="closeModal()" style="background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer">×</button>
    </div>
    <label class="form-lbl">Title</label><input class="form-inp" id="m-title" placeholder="Short verb-first title" value="${esc(t?t.title:"")}">
    <label class="form-lbl">Description</label><textarea class="form-inp" id="m-desc" style="height:68px;resize:vertical">${esc(t?t.desc:"")}</textarea>
    <div class="modal-row">
      <div><label class="form-lbl">Area</label><select class="form-inp" id="m-area">${aOpts}</select></div>
      <div><label class="form-lbl">Priority</label><select class="form-inp" id="m-prio"><option value="high" ${(t&&t.prio==="high")?"selected":""}>High</option><option value="medium" ${(!t||t.prio==="medium")?"selected":""}>Medium</option><option value="low" ${(t&&t.prio==="low")?"selected":""}>Low</option></select></div>
      <div><label class="form-lbl">Status</label><select class="form-inp" id="m-status">${cOpts}</select></div>
      <div><label class="form-lbl">Site</label><select class="form-inp" id="m-site">${sOpts}</select></div>
      <div><label class="form-lbl">Due date</label><input class="form-inp" id="m-due" type="date" value="${t?t.due:""}"></div>
      <div><label class="form-lbl">Jira</label><input class="form-inp" id="m-jira" placeholder="JP-###" style="font-family:'DM Mono',monospace" value="${esc(t?t.jira:"")}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">
      <button onclick="closeModal()" style="padding:7px 16px;border:1px solid var(--border2);border-radius:8px;background:transparent;font-size:13px;color:var(--text2);cursor:pointer">Cancel</button>
      <button onclick="saveModal()" style="padding:7px 18px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">${id?"Save changes":"Create task"}</button>
    </div>`;
  document.getElementById("modal-bg").className="open";
}
function closeModal(){document.getElementById("modal-bg").className="";}

async function saveModal(){
  const title=document.getElementById("m-title").value.trim();if(!title)return;
  const form={title,desc:document.getElementById("m-desc").value.trim(),area:document.getElementById("m-area").value,prio:document.getElementById("m-prio").value,status:document.getElementById("m-status").value,site:document.getElementById("m-site").value,due:document.getElementById("m-due").value,jira:document.getElementById("m-jira").value.trim()};
  if(modalEditId){
    tasks=tasks.map(t=>t.id===modalEditId?{...t,...form}:t);
    await writeTask(tasks.find(t=>t.id===modalEditId));
  }else{
    const newTask={...form,id:nextId++,created:today(),updates:[]};
    tasks.push(newTask);await writeTask(newTask);
  }
  closeModal();renderAll();
}

// ── AREA SETTINGS ─────────────────────────────────────────────────────────────
function openSettings(){renderSettings();document.getElementById("settings-bg").className="open";}
function closeSettings(){document.getElementById("settings-bg").className="";}
function renderSettings(){
  const isDefault=id=>DEFAULT_AREAS.some(a=>a.id===id);
  const swatches=PALETTE.map((p,i)=>`<div class="palette-swatch" onclick="selPalette=${i};renderSettings()" style="background:${dark?p.bg:p.lbg};border-color:${selPalette===i?(dark?p.fg:p.lfg):"transparent"};overflow:hidden"><div style="width:100%;height:100%;background:${dark?p.fg:p.lfg};opacity:.55;border-radius:4px"></div></div>`).join("");
  document.getElementById("settings-box").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <h3 style="font-size:15px;font-weight:600">Manage Areas</h3>
      <button onclick="closeSettings()" style="background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer">×</button>
    </div>
    ${areas.map(a=>{const abg=dark?a.bg:a.lbg,afg=dark?a.fg:a.lfg;return`<div class="area-row">
      <div style="width:14px;height:14px;border-radius:4px;background:${abg};border:1px solid ${afg};flex-shrink:0"></div>
      <input value="${esc(a.label)}" onchange="renameArea('${a.id}',this.value)" style="flex:1;background:transparent;border:none;border-bottom:1px solid var(--border2);border-radius:0;padding:2px 4px;font-size:13px;font-weight:500;color:var(--text)">
      ${isDefault(a.id)?`<span style="font-size:10px;color:var(--text3)">built-in</span>`:`<button onclick="removeArea('${a.id}')" style="background:transparent;border:none;color:#E24B4A;font-size:16px;cursor:pointer;padding:0 4px">×</button>`}
    </div>`;}).join("")}
    <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:4px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px">Add new area</div>
      <input id="new-area-name" placeholder="Area name…" oninput="previewArea()" style="width:100%;padding:8px 10px;border-radius:8px;margin-bottom:10px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:7px">Pick a colour</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${swatches}</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="area-preview" style="font-size:11px;color:var(--text3)">Type a name to preview</div>
        <button onclick="addArea()" style="margin-left:auto;padding:7px 16px;background:#1D9E75;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">+ Add area</button>
      </div>
    </div>`;
}
function previewArea(){
  const v=document.getElementById("new-area-name")?.value.trim();
  const p=PALETTE[selPalette];const bg=dark?p.bg:p.lbg,fg=dark?p.fg:p.lfg;
  document.getElementById("area-preview").innerHTML=v?`Preview: <span class="area-tag" style="background:${bg};color:${fg}">${esc(v)}</span>`:`<span style="color:var(--text3)">Type a name to preview</span>`;
}
function addArea(){
  const name=document.getElementById("new-area-name")?.value.trim();if(!name)return;
  areas.push({id:"area_"+Date.now(),label:name,...PALETTE[selPalette]});
  lsSet("v4pm_areas",areas);renderSettings();renderFilters();
}
function removeArea(id){
  if(DEFAULT_AREAS.some(a=>a.id===id))return;
  areas=areas.filter(a=>a.id!==id);lsSet("v4pm_areas",areas);renderSettings();renderFilters();
}
function renameArea(id,label){
  if(!label.trim())return;
  areas=areas.map(a=>a.id===id?{...a,label:label.trim()}:a);
  lsSet("v4pm_areas",areas);renderView();
}

// ── EMAIL TO TASK ─────────────────────────────────────────────────────────────
function openEmailModal(){
  document.getElementById("email-modal-bg").style.display="flex";
  document.getElementById("email-step-1").style.display="";
  document.getElementById("email-step-2").style.display="none";
  document.getElementById("email-step-3").style.display="none";
  document.getElementById("email-step-error").style.display="none";
  const inp=document.getElementById("email-input");if(inp){inp.value="";inp.focus();}
}
function closeEmailModal(){document.getElementById("email-modal-bg").style.display="none";}

async function analyzeEmail(){
  const emailText=document.getElementById("email-input")?.value.trim();
  if(!emailText){alert("Please paste an email first.");return;}
  document.getElementById("email-step-1").style.display="none";
  document.getElementById("email-step-2").style.display="block";
  const areaList=areas.map(a=>a.id+": "+a.label).join(", ");
  const prompt=`You are a program manager assistant. Analyze this Outlook email and extract a task. Return ONLY valid JSON, no markdown.\n\nEMAIL:\n${emailText}\n\nAvailable areas: ${areaList}\nSites: sella, austin, other\nToday: ${today()}\n\n{"title":"action-oriented title max 80 chars","desc":"2-3 sentence summary","area":"area id","prio":"high|medium|low","status":"backlog","site":"sella|austin|other","due":"YYYY-MM-DD or empty","jira":"JP-### or empty","email_preview":"From: sender — Subject: subject"}`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    const raw=data.content?.find(b=>b.type==="text")?.text||"";
    const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
    document.getElementById("em-title").value=parsed.title||"";
    document.getElementById("em-desc").value=parsed.desc||"";
    document.getElementById("em-due").value=parsed.due||"";
    document.getElementById("em-jira").value=parsed.jira||"";
    document.getElementById("em-area").innerHTML=areas.map(a=>`<option value="${a.id}" ${a.id===parsed.area?"selected":""}>${esc(a.label)}</option>`).join("");
    ["high","medium","low"].forEach(v=>{const o=document.getElementById("em-prio").querySelector(`option[value="${v}"]`);if(o)o.selected=v===parsed.prio;});
    SITES.forEach(v=>{const o=document.getElementById("em-site").querySelector(`option[value="${v}"]`);if(o)o.selected=v===parsed.site;});
    document.getElementById("email-step-2").style.display="none";
    document.getElementById("email-step-3").style.display="";
  }catch(e){
    document.getElementById("email-step-2").style.display="none";
    document.getElementById("email-error-msg").textContent=e.message||"Unknown error";
    document.getElementById("email-step-error").style.display="";
  }
}

async function saveEmailTask(){
  const title=document.getElementById("em-title").value.trim();if(!title){alert("Title required.");return;}
  const newTask={title,desc:document.getElementById("em-desc").value.trim(),area:document.getElementById("em-area").value,prio:document.getElementById("em-prio").value,status:document.getElementById("em-status").value,site:document.getElementById("em-site").value,due:document.getElementById("em-due").value,jira:document.getElementById("em-jira").value.trim(),id:nextId++,created:today(),updates:[],source:"email"};
  tasks.push(newTask);await writeTask(newTask);
  closeEmailModal();renderAll();showBanner("Task created from email ✓","connected",3000);
}

// ── MICROSOFT TO DO SYNC ──────────────────────────────────────────────────────
let todoToken=null;let todoListId=null;

async function syncToDo(){
  const btn=document.getElementById("todo-sync-btn");
  if(btn){btn.style.opacity=".5";btn.style.pointerEvents="none";}
  try{
    showBanner("Connecting to Microsoft To Do…","syncing",0);
    await getTodoToken();
    await getTodoListId();
    await pullTodoTasks();
  }catch(e){
    showBanner("To Do sync failed: "+(e.message||"error"),"error",5000);
    console.error(e);
  }finally{
    if(btn){btn.style.opacity="1";btn.style.pointerEvents="auto";}
  }
}

async function getTodoToken(){
  try{
    const c=JSON.parse(localStorage.getItem("v4pm_todo_token")||"null");
    if(c&&c.expires>Date.now()){todoToken=c.token;return;}
  }catch{}
  const dcRes=await fetch(`https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/devicecode`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`client_id=${TODO_CLIENT}&scope=https://graph.microsoft.com/Tasks.ReadWrite offline_access`});
  const dc=await dcRes.json();
  if(!dc.device_code)throw new Error("Could not start login: "+JSON.stringify(dc));
  showBanner(`Go to ${dc.verification_uri} — enter code: ${dc.user_code}`,"syncing",0);
  const interval=(dc.interval||5)*1000;
  const expires=Date.now()+dc.expires_in*1000;
  while(Date.now()<expires){
    await new Promise(r=>setTimeout(r,interval));
    const tr=await fetch(`https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`client_id=${TODO_CLIENT}&grant_type=urn:ietf:params:oauth2:grant-type:device_code&device_code=${dc.device_code}`});
    const td=await tr.json();
    if(td.access_token){
      todoToken=td.access_token;
      try{localStorage.setItem("v4pm_todo_token",JSON.stringify({token:td.access_token,expires:Date.now()+(td.expires_in-60)*1000}));}catch{}
      return;
    }
    if(td.error&&td.error!=="authorization_pending")throw new Error("Login failed: "+td.error_description);
  }
  throw new Error("Login timed out");
}

async function getTodoListId(){
  try{const c=localStorage.getItem("v4pm_todo_list");if(c){todoListId=c;return;}}catch{}
  const res=await fetch("https://graph.microsoft.com/v1.0/me/todo/lists",{headers:{Authorization:"Bearer "+todoToken}});
  const data=await res.json();
  if(!data.value)throw new Error("Could not fetch To Do lists");
  const list=data.value.find(l=>l.displayName==="V4 Tracker")||data.value.find(l=>l.wellknownListName==="defaultList")||data.value[0];
  if(!list)throw new Error("No To Do list found");
  todoListId=list.id;
  try{localStorage.setItem("v4pm_todo_list",list.id);}catch{}
}

async function pullTodoTasks(){
  const res=await fetch(`https://graph.microsoft.com/v1.0/me/todo/lists/${todoListId}/tasks?$filter=status ne 'completed'&$top=50`,{headers:{Authorization:"Bearer "+todoToken}});
  const data=await res.json();
  if(!data.value)throw new Error("Could not fetch tasks");
  let added=0;
  for(const item of data.value){
    if(tasks.find(t=>t.todoId===item.id))continue;
    const newTask={id:nextId++,todoId:item.id,title:item.title||"To Do task",desc:item.body?.content?item.body.content.replace(/<[^>]*>/g,"").slice(0,300):"Imported from Microsoft To Do",area:"cross",prio:item.importance==="high"?"high":item.importance==="low"?"low":"medium",status:"backlog",site:"sella",due:item.dueDateTime?.dateTime?.slice(0,10)||"",jira:"",created:today(),updates:[],source:"todo"};
    tasks.push(newTask);await writeTask(newTask);added++;
  }
  if(added>0){renderAll();showBanner(`${added} task${added>1?"s":""} imported from To Do ✓`,"connected",3000);}
  else showBanner("No new tasks in To Do","connected",3000);
}

applyTheme();
setSyncDot("syncing");
initFirebase();
loadFromFirebase();
</script>
